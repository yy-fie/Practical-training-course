<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-body">
  <div class="page-header">
    <h2>权限管理</h2>
    <span class="date" id="roleInfo"></span>
  </div>

  <div class="panel">
    <p class="text-muted">
      按角色勾选权限点后点「保存」立即生效；用户重新登录（或刷新页面）后菜单与按钮会按新权限显示。
      角色层级用于“重置密码/删除/改角色”的可操作范围：上级可管理下一层。
    </p>

    <table class="data-table">
      <thead>
        <tr><th style="width:130px;">角色</th><th style="width:110px;">上级角色</th><th>权限</th><th style="width:90px;">操作</th></tr>
      </thead>
      <tbody id="permRows"></tbody>
    </table>

    <p class="page-msg" id="msg"></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/permissions.js"></script>
</body>
</html>
