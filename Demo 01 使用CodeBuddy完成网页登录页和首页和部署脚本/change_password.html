<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改密码</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-body">
  <div class="form-card">
    <h2>修改密码</h2>
    <p class="form-sub">当前用户：<span id="curUser">-</span></p>

    <form id="pwdForm">
      <div class="field">
        <label for="oldPassword">原始密码</label>
        <input type="password" id="oldPassword" autocomplete="current-password" placeholder="请输入原始密码">
      </div>
      <div class="field">
        <label for="newPassword">新密码</label>
        <input type="password" id="newPassword" autocomplete="new-password" placeholder="至少 6 位">
      </div>
      <div class="field">
        <label for="confirmPassword">确认新密码</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="请再次输入新密码">
      </div>
      <button type="submit" class="btn" id="submitBtn">确认修改</button>
      <p class="error-msg" id="msg"></p>
    </form>

    <p class="form-tip">
      修改成功后需要重新登录；未登录用户不允许访问本页面。
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/change_password.js"></script>
</body>
</html>
