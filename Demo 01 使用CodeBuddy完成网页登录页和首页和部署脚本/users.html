<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-body">
  <div class="page-header">
    <h2>用户管理</h2>
    <span class="date" id="roleInfo"></span>
  </div>

  <div class="panel">
    <div class="toolbar">
      <input type="text" id="kwName" placeholder="姓名（模糊）">
      <input type="text" id="kwPhone" placeholder="手机号（模糊）">
      <select id="kwRole">
        <option value="">全部角色</option>
      </select>
      <button class="btn btn-inline" id="searchBtn">查询</button>
      <button class="btn btn-inline btn-secondary" id="resetBtn">重置</button>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th><th>姓名</th><th>手机号</th><th>角色</th>
          <th>院系</th><th>性别</th><th>邮箱</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="userRows"></tbody>
    </table>

    <div class="pager">
      <span id="pageInfo">-</span>
      <button id="prevBtn">上一页</button>
      <button id="nextBtn">下一页</button>
    </div>

    <p class="page-msg" id="msg"></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
